<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haiduc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<section class="login" id="login" hidden>
  <div class="login-card">
    <h1>Haiduc</h1>
    <p>Notes, links and tasks for the people on the members list.</p>
    <form id="loginForm">
      <label for="loginEmail" class="hint">Your email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required>
      <button class="btn primary" id="loginBtn" type="submit">Send sign-in link</button>
    </form>
    <div class="msg" id="loginMsg" hidden></div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><h1>Haiduc</h1><span class="status" id="status">connecting…</span></div>
    <div class="nav">
      <button id="navNotes" aria-pressed="true">Notes <span class="count" id="cNotes">0</span></button>
      <button id="navTasks" aria-pressed="false">Tasks <span class="count" id="cTasks">0</span></button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search notes" aria-label="Search notes">
      <button class="btn primary" id="newNote" title="New note">+ Note</button>
    </div>
    <div class="label" id="listLabel">All notes</div>
    <ul class="list" id="list"></ul>
    <div class="account"><span id="meEmail"></span><button id="signOut">Sign out</button></div>
  </aside>

  <main class="main" id="main">
    <div class="bar">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open note list">☰</button>
      <div class="crumbs" id="crumbs">Haiduc</div>
      <div class="seg" id="modeSeg">
        <button id="mEdit" aria-pressed="false">Edit</button>
        <button id="mRead" aria-pressed="true">Read</button>
      </div>
      <button class="btn" id="linksBtn" hidden>Links</button>
      <button class="btn danger" id="delBtn">Delete</button>
    </div>
    <div class="note" id="noteView"></div>
    <div class="board-wrap" id="taskView" hidden>
      <form class="add-task" id="taskForm">
        <input type="text" id="tTitle" placeholder="New task, e.g. Review level 12 layout" aria-label="Task title" required>
        <input type="date" id="tDue" aria-label="Due date">
        <select id="tNote" aria-label="Linked note"><option value="">No linked note</option></select>
        <button class="btn primary" type="submit">Add task</button>
      </form>
      <div class="board" id="board"></div>
    </div>
  </main>

  <aside class="links" id="links"></aside>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
