<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haiduc</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haiduc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<section class="login" id="login" hidden>
  <div class="login-card">
    <h1 class="brand-name"><img src="img/logo.png" alt="" class="logo">Haiduc</h1>
    <p>Notes, links and tasks for the people on the members list.</p>
    <form id="loginForm">
      <label for="loginEmail" class="hint">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required>
      <label for="loginPass" class="hint">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
      <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
      <div class="login-alt">
        <button type="button" class="link" id="signupBtn">First time here? Create account</button>
        <button type="button" class="link" id="magicBtn">Email me a link instead</button>
      </div>
    </form>
    <div class="msg" id="loginMsg" hidden></div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><h1 class="brand-name"><img src="img/logo.png" alt="" class="logo">Haiduc</h1><span class="status" id="status">connecting…</span></div>
    <div class="nav">
      <button id="navNotes" aria-pressed="true">Notes <span class="count" id="cNotes">0</span></button>
      <button id="navTasks" aria-pressed="false">Tasks <span class="count" id="cTasks">0</span></button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search notes" aria-label="Search notes">
      <button class="btn primary" id="newNote" title="New note">+ Note</button>
    </div>
    <div class="tag-list" id="tagList" hidden></div>
    <div class="label list-head"><span id="listLabel">All notes</span><button class="link-btn" id="deletedBtn">Deleted notes</button></div>
    <ul class="list" id="list"></ul>
    <div class="account"><span id="meEmail"></span><span class="acct-btns"><button id="setPass">Set password</button><button id="signOut">Sign out</button></span></div>
  </aside>

  <main class="main" id="main">
    <div class="bar">
      <button class="btn back-btn" id="menuBtn" aria-label="Back to notes">‹ Notes</button>
      <div class="crumbs" id="crumbs">Haiduc</div>
      <div class="seg" id="modeSeg">
        <button id="mEdit" aria-pressed="false">Edit</button>
        <button id="mRead" aria-pressed="true">Read</button>
      </div>
      <button class="btn" id="linksBtn" hidden>Links</button>
      <button class="btn save-btn" id="saveBtn" data-state="saved" disabled>Saved ✓</button>
      <button class="btn hist-btn" id="histBtn" title="Earlier versions of this note"><span class="ico" aria-hidden="true">↺</span><span class="lbl">History</span></button>
      <button class="btn danger" id="delBtn">Delete</button>
    </div>
    <div class="note" id="noteView"></div>
    <div class="board-wrap" id="taskView" hidden>
      <div class="task-head"><div class="seg" id="tvSeg" role="group" aria-label="Task view"><button id="tvBoard" aria-pressed="true">Board</button><button id="tvGantt" aria-pressed="false">Timeline</button></div></div>
      <form class="add-task" id="taskForm">
        <input type="text" id="tTitle" placeholder="New task, e.g. Review level 12 layout" aria-label="Task title" required>
        <label class="dl" for="tStart">Start<input type="date" id="tStart"></label>
        <label class="dl" for="tDue">Due<input type="date" id="tDue"></label>
        <select id="tNote" aria-label="Linked note"><option value="">No linked note</option></select>
        <button class="btn primary" type="submit">Add task</button>
      </form>
      <div class="board" id="board"></div>
      <div class="gantt" id="gantt" hidden></div>
    </div>
  </main>

  <aside class="links" id="links"></aside>
</div>
<nav class="tabbar" id="tabbar" hidden aria-label="Sections">
  <button id="tbNotes" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 12h7 M9 16h7"/></svg>Notes</button>
  <button id="tbNew" class="tb-new" aria-label="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></button>
  <button id="tbTasks" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3v3H4z M4 15h3v3H4z M10 7.5h10 M10 16.5h10"/></svg>Tasks<span class="tb-count" id="tbCount"></span></button>
</nav>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
